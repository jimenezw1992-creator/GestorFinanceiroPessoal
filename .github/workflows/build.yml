name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. DESCARGAR REPOSITORIO
      # ==========================================
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # ==========================================
      # 2. INSTALAR JAVA
      # ==========================================
      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. INSTALAR GRADLE
      # ==========================================
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # ==========================================
      # 4. BUSCAR ZIP
      # ==========================================
      - name: Buscar proyecto ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUSCANDO PROYECTO ZIP"
          echo "======================================"

          ZIP_FILE=""

          while IFS= read -r file; do
            echo "Encontrado: $file"

            if [[ -z "$ZIP_FILE" ]]; then
              ZIP_FILE="$file"
            fi
          done < <(
            find . \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              ! -path "./.github/*"
          )

          if [[ -z "$ZIP_FILE" ]]; then
            echo ""
            echo "ERROR: No se encontró ningún archivo ZIP."
            exit 1
          fi

          echo ""
          echo "ZIP seleccionado:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ==========================================
      # 5. DESCOMPRIMIR
      # ==========================================
      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DESCOMPRIMIENDO PROYECTO"
          echo "======================================"

          rm -rf proyecto_extraido
          mkdir -p proyecto_extraido

          unzip -q "$ZIP_FILE" -d proyecto_extraido

          echo ""
          echo "Proyecto extraído."

          find proyecto_extraido -maxdepth 4 -type f | head -100

      # ==========================================
      # 6. DETECTAR PROYECTO ANDROID
      # ==========================================
      - name: Detectar proyecto Android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DETECTANDO PROYECTO ANDROID"
          echo "======================================"

          PROJECT_DIR=""

          # Buscar settings.gradle / settings.gradle.kts
          while IFS= read -r settings_file; do

            DIR="$(dirname "$settings_file")"

            echo "Revisando: $DIR"

            if [[ -d "$DIR/app" ]] && \
               { [[ -f "$DIR/build.gradle" ]] || \
                 [[ -f "$DIR/build.gradle.kts" ]]; }; then

              PROJECT_DIR="$DIR"
              break

            fi

          done < <(
            find proyecto_extraido \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              ! -path "*/.gradle/*"
          )

          # Segunda búsqueda: carpeta app
          if [[ -z "$PROJECT_DIR" ]]; then

            while IFS= read -r app_dir; do

              DIR="$(dirname "$app_dir")"

              if [[ -f "$DIR/build.gradle" ]] || \
                 [[ -f "$DIR/build.gradle.kts" ]]; then

                PROJECT_DIR="$DIR"
                break

              fi

            done < <(
              find proyecto_extraido \
                -type d \
                -name "app" \
                ! -path "*/.gradle/*"
            )

          fi

          if [[ -z "$PROJECT_DIR" ]]; then

            echo ""
            echo "======================================"
            echo "ERROR"
            echo "======================================"
            echo "No se encontró un proyecto Android."
            echo ""
            echo "Archivos encontrados:"
            find proyecto_extraido \
              -maxdepth 6 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo ""
          echo "======================================"
          echo "PROYECTO ENCONTRADO"
          echo "======================================"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 7. CONFIGURAR ANDROIDX
      # ==========================================
      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "CONFIGURANDO ANDROIDX"
          echo "======================================"

          touch gradle.properties

          sed -i '/^[[:space:]]*android\.useAndroidX[[:space:]]*=/d' gradle.properties
          sed -i '/^[[:space:]]*android\.enableJetifier[[:space:]]*=/d' gradle.properties

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          echo ""
          echo "gradle.properties:"
          cat gradle.properties

      # ==========================================
      # 8. PREPARAR GRADLE
      # ==========================================
      - name: Preparar Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [[ -f "./gradlew" ]]; then

            echo "Gradle Wrapper encontrado."

            chmod +x ./gradlew

          else

            echo "No se encontró gradlew."
            echo "Se utilizará Gradle 8.10.2."

          fi

      # ==========================================
      # 9. LIMPIAR
      # ==========================================
      - name: Limpiar proyecto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "LIMPIANDO PROYECTO"
          echo "======================================"

          if [[ -f "./gradlew" ]]; then

            ./gradlew clean --no-daemon

          else

            gradle clean --no-daemon

          fi

      # ==========================================
      # 10. COMPILAR APK
      # ==========================================
      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "======================================"
          echo "COMPILANDO APK"
          echo "======================================"
          echo ""

          if [[ -f "./gradlew" ]]; then

            chmod +x ./gradlew

            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace

          else

            gradle assembleDebug \
              --no-daemon \
              --stacktrace

          fi

          echo ""
          echo "======================================"
          echo "APK COMPILADO"
          echo "======================================"

      # ==========================================
      # 11. BUSCAR APK
      # ==========================================
      - name: Buscar APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUSCANDO APK"
          echo "======================================"

          APK_FILE=""

          while IFS= read -r file; do

            echo "APK encontrado: $file"

            if [[ -z "$APK_FILE" ]]; then
              APK_FILE="$file"
            fi

          done < <(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              2>/dev/null
          )

          if [[ -z "$APK_FILE" ]]; then

            echo ""
            echo "ERROR: No se encontró el APK."
            echo ""

            find "$PROJECT_DIR/app/build" \
              -maxdepth 8 \
              -type f \
              2>/dev/null || true

            exit 1

          fi

          echo ""
          echo "APK:"
          echo "$APK_FILE"

          mkdir -p apk_final

          cp "$APK_FILE" \
            apk_final/GestorFinanceiroPessoal-debug.apk

      # ==========================================
      # 12. SUBIR APK
      # ==========================================
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorFinanceiroPessoal-APK
          path: apk_final/GestorFinanceiroPessoal-debug.apk
          if-no-files-found: error
          retention-days: 30
