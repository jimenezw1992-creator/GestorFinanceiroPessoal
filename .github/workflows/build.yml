name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. PREPARAR UBUNTU
      # ==========================================
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # ==========================================
      # 2. INSTALAR JAVA
      # ==========================================
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # 3. INSTALAR GRADLE
      # ==========================================
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # ==========================================
      # 4. BUSCAR PROYECTO ZIP
      # ==========================================
      - name: Buscar proyecto ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUSCANDO ARCHIVO ZIP DEL PROYECTO"
          echo "======================================"

          ZIP_FILE=""

          while IFS= read -r file; do
            echo "ZIP encontrado: $file"

            if [[ -z "$ZIP_FILE" ]]; then
              ZIP_FILE="$file"
            fi
          done < <(find . -type f -iname "*.zip" \
            ! -path "./.git/*" \
            ! -path "./.github/*")

          if [[ -z "$ZIP_FILE" ]]; then
            echo "No se encontró ningún archivo ZIP."
            exit 1
          fi

          echo ""
          echo "Usando ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ==========================================
      # 5. DESCOMPRIMIR PROYECTO
      # ==========================================
      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DESCOMPRIMIENDO PROYECTO"
          echo "======================================"

          rm -rf proyecto_extraido
          mkdir -p proyecto_extraido

          unzip -q "$ZIP_FILE" -d proyecto_extraido

          echo ""
          echo "Contenido extraído:"
          find proyecto_extraido -maxdepth 3 -type f | head -100

      # ==========================================
      # 6. DETECTAR PROYECTO ANDROID
      # ==========================================
      - name: Detectar proyecto Android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DETECTANDO PROYECTO ANDROID"
          echo "======================================"

          PROJECT_DIR=""

          while IFS= read -r settings_file; do

            DIR="$(dirname "$settings_file")"

            echo "Revisando: $DIR"

            if [[ -d "$DIR/app" ]]; then
              if [[ -f "$DIR/build.gradle" ]] || \
                 [[ -f "$DIR/build.gradle.kts" ]]; then

                PROJECT_DIR="$DIR"
                break

              fi
            fi

          done < <(
            find proyecto_extraido \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              ! -path "*/.gradle/*"
          )

          # Si no se encontró mediante settings.gradle,
          # buscar directamente una carpeta que tenga app y build.gradle.
          if [[ -z "$PROJECT_DIR" ]]; then

            while IFS= read -r app_dir; do

              DIR="$(dirname "$app_dir")"

              if [[ -f "$DIR/build.gradle" ]] || \
                 [[ -f "$DIR/build.gradle.kts" ]]; then

                PROJECT_DIR="$DIR"
                break

              fi

            done < <(
              find proyecto_extraido \
                -type d \
                -name "app" \
                ! -path "*/.gradle/*"
            )

          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo ""
            echo "ERROR: No se encontró un proyecto Android válido."
            echo ""
            echo "Archivos encontrados:"
            find proyecto_extraido -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo ""
          echo "======================================"
          echo "PROYECTO ANDROID ENCONTRADO"
          echo "======================================"
          echo "$PROJECT_DIR"
          echo ""

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 7. CONFIGURAR ANDROIDX
      # ==========================================
      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CONFIGURANDO ANDROIDX"
          echo "======================================"

          cd "$PROJECT_DIR"

          touch gradle.properties

          # Eliminar propiedades antiguas para evitar duplicados
          sed -i '/^[[:space:]]*android\.useAndroidX[[:space:]]*=/d' gradle.properties
          sed -i '/^[[:space:]]*android\.enableJetifier[[:space:]]*=/d' gradle.properties

          # Habilitar AndroidX
          echo "android.useAndroidX=true" >> gradle.properties

          # Jetifier permite compatibilidad con dependencias antiguas
          echo "android.enableJetifier=true" >> gradle.properties

          echo ""
          echo "gradle.properties:"
          cat gradle.properties

      # ==========================================
      # 8. DAR PERMISOS AL GRADLE WRAPPER
      # ==========================================
      - name: Preparar Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [[ -f "./gradlew" ]]; then
            chmod +x ./gradlew
            echo "Gradle Wrapper encontrado."
          else
            echo "No existe gradlew."
            echo "Se utilizará Gradle instalado en el runner."
          fi

      # ==========================================
      # 9. LIMPIAR PROYECTO
      # ==========================================
      - name: Limpiar proyecto
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "LIMPIANDO PROYECTO"
          echo "======================================"

          if [[ -f "./gradlew" ]]; then
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      # ==========================================
      # 10. COMPILAR APK
      # ==========================================
      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "======================================"
          echo "COMPILANDO APK"
          echo "======================================"
          echo ""

          if [[ -f "./gradlew" ]]; then

            chmod +x ./gradlew

            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace

          else

            gradle assembleDebug \
              --no-daemon \
              --stacktrace

          fi

          echo ""
          echo "======================================"
          echo "COMPILACIÓN TERMINADA"
          echo "======================================"

      # ==========================================
      # 11. BUSCAR APK
      # ==========================================
      - name: Buscar APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUSCANDO APK"
          echo "======================================"

          APK_FILE=""

          while IFS= read -r file; do
            echo "APK encontrado: $file"

            if [[ -z "$APK_FILE" ]]; then
              APK_FILE="$file"
            fi

          done < <(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              2>/dev/null
          )

          if [[ -z "$APK_FILE" ]]; then
            echo ""
            echo "ERROR: No se encontró ningún APK."
            echo ""
            echo "Contenido de build:"
            find "$PROJECT_DIR/app/build" \
              -maxdepth 6 \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "APK encontrado:"
          echo "$APK_FILE"

          mkdir -p apk_final

          cp "$APK_FILE" apk_final/GestorFinanceiroPessoal-debug.apk

          echo ""
          echo "APK preparado correctamente."

      # ==========================================
      # 12. SUBIR APK COMO ARTIFACT
      # ==========================================
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: GestorFinanceiroPessoal-APK
          path: apk_final/GestorFinanceiroPessoal-debug.apk
          if-no-files-found: error
          retention-days: 30
