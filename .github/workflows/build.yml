name: Compilar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:

      # 1. Descargar el repositorio
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # 2. Instalar Java
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Instalar Gradle
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 4. Buscar el archivo ZIP del proyecto
      - name: Buscar proyecto ZIP
        id: buscar_zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún archivo ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 5. Descomprimir el proyecto
      - name: Descomprimir proyecto
        shell: bash
        run: |
          rm -rf proyecto_extraido
          mkdir -p proyecto_extraido

          unzip -o "${{ steps.buscar_zip.outputs.zip_file }}" -d proyecto_extraido

          echo "Contenido descomprimido:"
          find proyecto_extraido -maxdepth 3 -type f | head -100

      # 6. Encontrar automáticamente la carpeta Android
      - name: Detectar proyecto Android
        id: detectar_proyecto
        shell: bash
        run: |
          PROJECT_DIR=""

          SETTINGS_FILE=$(find proyecto_extraido \
            -type f \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts"
